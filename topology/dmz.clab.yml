# Topologie DMZ-Labor: 14 Knoten, Adressen und Routen
# eth0 gehoert dem Management-Netz von Containerlab (172.20.20.0/24).

name: dmz

topology:
  kinds:
    linux:
      memory: 64MB

  nodes:
    #Internet und Remote Office
    inet:
      kind: linux
      image: router:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 203.0.113.1/30 dev eth1
        - ip addr add 198.51.100.1/30 dev eth2
        - ip addr add 192.0.2.1/24 dev eth3
        - ip addr add 198.51.100.5/30 dev eth4
        - ip route del default

    attacker:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 192.0.2.10/24 dev eth1
        - ip route replace default via 192.0.2.1 dev eth1

    ro-client1:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 198.51.100.2/30 dev eth1
        - ip route replace default via 198.51.100.1 dev eth1

    ro-client2:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 198.51.100.6/30 dev eth1
        - ip route replace default via 198.51.100.5 dev eth1

    #Edge-Firewall 
    fw-edge:
      kind: linux
      image: fw:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 203.0.113.2/30 dev eth1
        - ip addr add 10.10.0.1/30 dev eth2
        - ip addr add 10.10.0.5/30 dev eth3
        - ip addr add 10.10.0.9/30 dev eth4
        - ip route replace default via 203.0.113.1 dev eth1
        - ip route add 10.10.10.0/24 via 10.10.0.2 dev eth2
        - ip route add 10.10.20.0/24 via 10.10.0.6 dev eth3
        - ip route add 10.10.30.0/24 via 10.10.0.10 dev eth4

    #DMZ 
    fw-dmz:
      kind: linux
      image: fw:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.2/30 dev eth1
        - ip addr add 10.10.10.1/30 dev eth2
        - ip addr add 10.10.10.5/30 dev eth3
        - ip addr add 10.10.10.9/30 dev eth4
        - ip addr add 10.10.10.13/30 dev eth5
        # eth6: Spiegelausgang zum IDS, nochohne Adresse 

    proxy:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.10.2/30 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1

    waf:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.10.6/30 dev eth1
        - ip route replace default via 10.10.10.5 dev eth1

    web:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.10.10/30 dev eth1
        - ip route replace default via 10.10.10.9 dev eth1

    ids:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.10.14/30 dev eth1
        # eth2: Mitschnitt vom Spiegelport, ohne Adresse
        - ip route replace default via 10.10.10.13 dev eth1

    #Client-Netz
    router-int:
      kind: linux
      image: router:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.6/30 dev eth1
        - ip addr add 10.10.20.1/24 dev eth2
        - ip route replace default via 10.10.0.5 dev eth1

    client1:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1 dev eth1

    #Backend-Netz
    fw-backend:
      kind: linux
      image: fw:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.10/30 dev eth1
        - ip addr add 10.10.30.1/24 dev eth2
        - ip route replace default via 10.10.0.9 dev eth1

    siem:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.30.10/24 dev eth1
        - ip route replace default via 10.10.30.1 dev eth1

  links:
    # Internet und Remote Office
    - endpoints: ["inet:eth1", "fw-edge:eth1"]
    - endpoints: ["inet:eth2", "ro-client1:eth1"]
    - endpoints: ["inet:eth3", "attacker:eth1"]
    - endpoints: ["inet:eth4", "ro-client2:eth1"]
    # Transit
    - endpoints: ["fw-edge:eth2", "fw-dmz:eth1"]
    - endpoints: ["fw-edge:eth3", "router-int:eth1"]
    - endpoints: ["fw-edge:eth4", "fw-backend:eth1"]
    # DMZ
    - endpoints: ["fw-dmz:eth2", "proxy:eth1"]
    - endpoints: ["fw-dmz:eth3", "waf:eth1"]
    - endpoints: ["fw-dmz:eth4", "web:eth1"]
    - endpoints: ["fw-dmz:eth5", "ids:eth1"]
    - endpoints: ["fw-dmz:eth6", "ids:eth2"]
    # Client-Netz
    - endpoints: ["router-int:eth2", "client1:eth1"]
    # Backend-Netz
    - endpoints: ["fw-backend:eth2", "siem:eth1"]
