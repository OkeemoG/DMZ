# Topologie DMZ-Labor: 14 Knoten, Adressen und Routen
# Ohne Management-Netz: network-mode none, kein eth0 (Phase 3, Schritt 3.1).

name: dmz

topology:
  kinds:
    linux:
      memory: 64MB
      network-mode: none

  nodes:
    #Internet und Remote Office
    inet:
      kind: linux
      image: router:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 203.0.113.1/30 dev eth1
        - ip addr add 198.51.100.1/30 dev eth2
        - ip addr add 192.0.2.1/24 dev eth3
        - ip addr add 198.51.100.5/30 dev eth4

    attacker:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 192.0.2.10/24 dev eth1
        - ip route replace default via 192.0.2.1 dev eth1

    # VPN (IKEv2/IPsec, strongSwan): Zertifikate und Schluessel aus configs/vpn/pki (make pki)
    ro-client1:
      kind: linux
      image: client:0.1
      binds:
        - ../configs/vpn/ro-client.conf:/etc/swanctl/swanctl.conf:ro
        - ../configs/vpn/strongswan-lab.conf:/etc/strongswan.d/lab.conf:ro
        - ../configs/vpn/vpn-start.sh:/etc/swanctl/vpn-start.sh:ro
        - ../configs/vpn/pki/ca.crt:/etc/swanctl/x509ca/ca.crt:ro
        - ../configs/vpn/pki/ro-client1.crt:/etc/swanctl/x509/client.crt:ro
        - ../configs/vpn/pki/ro-client1.key:/etc/swanctl/private/client.key:ro
      exec:
        - ip addr add 198.51.100.2/30 dev eth1
        - ip route replace default via 198.51.100.1 dev eth1
        - sh /etc/swanctl/vpn-start.sh

    ro-client2:
      kind: linux
      image: client:0.1
      binds:
        - ../configs/vpn/ro-client.conf:/etc/swanctl/swanctl.conf:ro
        - ../configs/vpn/strongswan-lab.conf:/etc/strongswan.d/lab.conf:ro
        - ../configs/vpn/vpn-start.sh:/etc/swanctl/vpn-start.sh:ro
        - ../configs/vpn/pki/ca.crt:/etc/swanctl/x509ca/ca.crt:ro
        - ../configs/vpn/pki/ro-client2.crt:/etc/swanctl/x509/client.crt:ro
        - ../configs/vpn/pki/ro-client2.key:/etc/swanctl/private/client.key:ro
      exec:
        - ip addr add 198.51.100.6/30 dev eth1
        - ip route replace default via 198.51.100.5 dev eth1
        - sh /etc/swanctl/vpn-start.sh

    #Edge-Firewall
    fw-edge:
      kind: linux
      image: fw:0.1
      binds:
        - ../configs/fw-edge/nftables.nft:/etc/nftables.nft:ro
        - ../configs/fw/ulogd.conf:/etc/ulogd-dmz.conf:ro
        - ../configs/response/fw-response.sh:/etc/response/fw-response:ro
        - ../configs/response/sshd_config:/etc/response/sshd_config:ro
        - ../configs/response/sshd-start.sh:/etc/response/sshd-start.sh:ro
        - ../configs/response/keys/fw-edge_host.key:/etc/response/keys/fw-edge_host.key:ro
        - ../configs/response/keys/authorized_keys:/etc/response/keys/authorized_keys:ro
        - ../configs/vpn/fw-edge.conf:/etc/swanctl/swanctl.conf:ro
        - ../configs/vpn/strongswan-lab.conf:/etc/strongswan.d/lab.conf:ro
        - ../configs/vpn/vpn-start.sh:/etc/swanctl/vpn-start.sh:ro
        - ../configs/vpn/pki/ca.crt:/etc/swanctl/x509ca/ca.crt:ro
        - ../configs/vpn/pki/fw-edge.crt:/etc/swanctl/x509/fw-edge.crt:ro
        - ../configs/vpn/pki/fw-edge.key:/etc/swanctl/private/fw-edge.key:ro
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 203.0.113.2/30 dev eth1
        - ip addr add 10.10.0.1/30 dev eth2
        - ip addr add 10.10.0.5/30 dev eth3
        - ip addr add 10.10.0.9/30 dev eth4
        - ip route replace default via 203.0.113.1 dev eth1
        - ip route add 10.10.10.0/24 via 10.10.0.2 dev eth2
        - ip route add 10.10.20.0/24 via 10.10.0.6 dev eth3
        - ip route add 10.10.30.0/24 via 10.10.0.10 dev eth4
        - syslogd -R 10.10.30.10:5140
        - ulogd -d -c /etc/ulogd-dmz.conf
        - nft -f /etc/nftables.nft
        - sh /etc/response/sshd-start.sh
        - sh /etc/swanctl/vpn-start.sh

    #DMZ 
    fw-dmz:
      kind: linux
      image: fw:0.1
      binds:
        - ../configs/fw-dmz/nftables.nft:/etc/nftables.nft:ro
        - ../configs/fw/ulogd.conf:/etc/ulogd-dmz.conf:ro
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.2/30 dev eth1
        - ip addr add 10.10.10.1/30 dev eth2
        - ip addr add 10.10.10.5/30 dev eth3
        - ip addr add 10.10.10.9/30 dev eth4
        - ip addr add 10.10.10.13/30 dev eth5
        # eth6: Spiegelausgang zum IDS, ohne Adresse (V-11)
        - sysctl -w net.ipv6.conf.eth6.disable_ipv6=1
        - ip route replace default via 10.10.0.1 dev eth1
        - syslogd -R 10.10.30.10:5140
        - ulogd -d -c /etc/ulogd-dmz.conf
        - nft -f /etc/nftables.nft
        # Spiegelung: eingehende Pakete von eth1 bis eth4 als Kopie nach eth6, vor der Filterung
        - tc qdisc add dev eth1 clsact
        - tc filter add dev eth1 ingress matchall action mirred egress mirror dev eth6
        - tc qdisc add dev eth2 clsact
        - tc filter add dev eth2 ingress matchall action mirred egress mirror dev eth6
        - tc qdisc add dev eth3 clsact
        - tc filter add dev eth3 ingress matchall action mirred egress mirror dev eth6
        - tc qdisc add dev eth4 clsact
        - tc filter add dev eth4 ingress matchall action mirred egress mirror dev eth6

    proxy:
      kind: linux
      image: proxy:0.1
      binds:
        - ../configs/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      exec:
        - ip addr add 10.10.10.2/30 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1

    waf:
      kind: linux
      image: waf:0.1
      memory: 256MB
      binds:
        - ../configs/waf/realip.conf:/etc/nginx/conf.d/00-realip.conf:ro
        - ../configs/waf/siem.conf:/etc/nginx/conf.d/10-siem.conf:ro
        - ../configs/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/opt/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
        - ../configs/waf/REQUEST-899-DMZ-VIRTUAL-PATCHES.conf:/opt/owasp-crs/rules/REQUEST-899-DMZ-VIRTUAL-PATCHES.conf:ro
      env:
        BACKEND: http://10.10.10.10:8080
        PORT: "8080"
        MODSEC_RULE_ENGINE: "On"
        BLOCKING_PARANOIA: "1"
        ANOMALY_INBOUND: "5"
        SET_REAL_IP_FROM: "10.10.10.2"
        REAL_IP_HEADER: "X-Real-IP"
        REAL_IP_RECURSIVE: "off"
      exec:
        - ip addr add 10.10.10.6/30 dev eth1
        - ip route replace default via 10.10.10.5 dev eth1

    web:
      kind: linux
      image: web:0.1
      memory: 128MB
      env:
        APP_MODE: ${APP_MODE:=vulnerable}
      exec:
        - ip addr add 10.10.10.10/30 dev eth1
        - ip route replace default via 10.10.10.9 dev eth1

    ids:
      kind: linux
      image: ids:0.1
      memory: 256MB
      binds:
        - ../configs/ids/lab.yaml:/etc/suricata/lab.yaml:ro
        - ../configs/ids/local.rules:/etc/suricata/local.rules:ro
      exec:
        - ip addr add 10.10.10.14/30 dev eth1
        - ip route replace default via 10.10.10.13 dev eth1
        # eth2: Mitschnitt vom Spiegelport, ohne Adresse (V-11)
        - sysctl -w net.ipv6.conf.eth2.disable_ipv6=1
        - syslogd -R 10.10.30.10:5140
        - suricata --include /etc/suricata/lab.yaml --af-packet -D

    #Client-Netz
    router-int:
      kind: linux
      image: router:0.1
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.6/30 dev eth1
        - ip addr add 10.10.20.1/24 dev eth2
        - ip route replace default via 10.10.0.5 dev eth1

    client1:
      kind: linux
      image: client:0.1
      exec:
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1 dev eth1

    #Backend-Netz
    fw-backend:
      kind: linux
      image: fw:0.1
      binds:
        - ../configs/fw-backend/nftables.nft:/etc/nftables.nft:ro
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr add 10.10.0.10/30 dev eth1
        - ip addr add 10.10.30.1/24 dev eth2
        - ip route replace default via 10.10.0.9 dev eth1
        - nft -f /etc/nftables.nft

    siem:
      kind: linux
      image: client:0.1
      network-mode: bridge
      ports:
        - 3000:3000
      binds:
        - ../configs/siem/mgmt-routing.sh:/etc/siem/mgmt-routing.sh:ro
      exec:
        - ip addr add 10.10.30.10/24 dev eth1
        - sh /etc/siem/mgmt-routing.sh

    siem-collector:
      kind: linux
      image: fluent/fluent-bit:5.1.5
      network-mode: container:siem
      memory: 64MB
      cmd: -c /fluent-bit/etc/dmz.yaml
      binds:
        - ../configs/siem/fluent-bit.yaml:/fluent-bit/etc/dmz.yaml:ro
      stages:
        create:
          wait-for:
            - node: siem
              stage: create

    siem-responder:
      kind: linux
      image: responder:0.1
      network-mode: container:siem
      memory: 64MB
      env:
        RESPONDER_MODE: ${RESPONDER_MODE:=enforce}
      binds:
        - ../configs/response/playbook.json:/etc/responder/playbook.json:ro
        - ../configs/response/keys/responder.key:/etc/responder/keys/responder.key:ro
        - ../configs/response/keys/known_hosts:/etc/responder/keys/known_hosts:ro
      stages:
        create:
          wait-for:
            - node: siem
              stage: create

    siem-loki:
      kind: linux
      image: grafana/loki:3.7.9
      network-mode: container:siem
      memory: 256MB
      binds:
        - ../configs/siem/loki.yaml:/etc/loki/local-config.yaml:ro
      stages:
        create:
          wait-for:
            - node: siem
              stage: create

    siem-grafana:
      kind: linux
      image: grafana/grafana:13.3.0
      network-mode: container:siem
      memory: 512MB
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:=dmz-soc}
        GF_USERS_ALLOW_SIGN_UP: "false"
        GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
        GF_ANALYTICS_REPORTING_ENABLED: "false"
        GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
        GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
        GF_PLUGINS_PREINSTALL_DISABLED: "true"
        GF_NEWS_NEWS_FEED_ENABLED: "false"
        GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/soc.json
      binds:
        - ../configs/siem/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/dmz.yaml:ro
        - ../configs/siem/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dmz.yaml:ro
        - ../configs/siem/dashboards:/var/lib/grafana/dashboards:ro
      stages:
        create:
          wait-for:
            - node: siem
              stage: create

  links:
    # Internet und Remote Office
    - endpoints: ["inet:eth1", "fw-edge:eth1"]
    - endpoints: ["inet:eth2", "ro-client1:eth1"]
    - endpoints: ["inet:eth3", "attacker:eth1"]
    - endpoints: ["inet:eth4", "ro-client2:eth1"]
    # Transit
    - endpoints: ["fw-edge:eth2", "fw-dmz:eth1"]
    - endpoints: ["fw-edge:eth3", "router-int:eth1"]
    - endpoints: ["fw-edge:eth4", "fw-backend:eth1"]
    # DMZ
    - endpoints: ["fw-dmz:eth2", "proxy:eth1"]
    - endpoints: ["fw-dmz:eth3", "waf:eth1"]
    - endpoints: ["fw-dmz:eth4", "web:eth1"]
    - endpoints: ["fw-dmz:eth5", "ids:eth1"]
    - endpoints: ["fw-dmz:eth6", "ids:eth2"]
    # Client-Netz
    - endpoints: ["router-int:eth2", "client1:eth1"]
    # Backend-Netz
    - endpoints: ["fw-backend:eth2", "siem:eth1"]
