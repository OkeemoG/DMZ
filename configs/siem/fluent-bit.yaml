service:
  flush: 0.2
  log_level: info

parsers:
  - name: dmz-syslog
    format: regex
    regex: '^\<(?<pri>[0-9]{1,3})\>(?<time>[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}) (?:(?<host>[^ \[:]+) )?(?<ident>[^ :\[]+)(?:\[(?<pid>[0-9]+)\])?: ?(?<message>.*)$'

pipeline:
  inputs:
    - name: syslog
      mode: udp
      listen: 0.0.0.0
      port: 5140
      parser: dmz-syslog
      source_address_key: src_addr

  filters:
    - name: grep
      match: '*'
      logical_op: and
      exclude:
        - ident ^modsecurity$
        - 'message ^(?!.*ModSecurity: )'

  outputs:
    - name: loki
      match: '*'
      host: 127.0.0.1
      port: 3100
      labels: job=dmz, host=$host, ident=$ident
      line_format: json
