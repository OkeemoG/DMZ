service:
  flush: 0.2
  log_level: info

parsers:
  - name: dmz-syslog
    format: regex
    regex: '^\<(?<pri>[0-9]{1,3})\>(?<time>[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}) (?:(?<host>[^ \[:]+) )?(?<ident>[^ :\[]+)(?:\[(?<pid>[0-9]+)\])?: ?(?<message>.*)$'
  - name: dmz-json
    format: json
  - name: waf-deny
    format: regex
    regex: '\[client (?<client>[0-9a-fA-F.:]+)\] ModSecurity: Access denied with code (?<status>[0-9]+).*Total Score: (?<score>[0-9]+)\).*\[uri "(?<uri>[^"]*)"\]'
  - name: waf-warn
    format: regex
    regex: 'ModSecurity: Warning\. .*\[id "(?<rule_id>[0-9]+)"\].*?\[msg "(?<rule_msg>[^"]*)"\].*?\[tag "attack-(?<attack>[a-z-]+)"\].*\[uri "(?<uri>[^"]*)"\].*, client: (?<client>[0-9a-fA-F.:]+),'
  - name: fw-drop
    format: regex
    regex: '^(?<fw_rule>[a-z-]+ (?:input|forward|block|quarantine|spoof) drop): +IN=(?<in_if>\S*) +OUT=(?<out_if>\S*) .*?SRC=(?<client>[0-9a-fA-F.:]+) DST=(?<dst>[0-9a-fA-F.:]+) .*?PROTO=(?<proto>[A-Z0-9]+)(?: SPT=(?<spt>[0-9]+) DPT=(?<dpt>[0-9]+))?'

pipeline:
  inputs:
    - name: syslog
      mode: udp
      listen: 0.0.0.0
      port: 5140
      parser: dmz-syslog
      source_address_key: src_addr

  filters:
    - name: grep
      match: '*'
      logical_op: and
      exclude:
        - ident ^modsecurity$
        - 'message ^(?!.*ModSecurity: )'

    - name: modify
      match: '*'
      condition: Key_Value_Equals ident suricata
      set: host ids

    - name: modify
      match: '*'
      condition: 'Key_Value_Matches src_addr ^udp://10\.10\.0\.2:'
      set: host fw-dmz

    - name: modify
      match: '*'
      condition: 'Key_Value_Matches src_addr ^udp://10\.10\.0\.9:'
      set: host fw-edge

    - name: parser
      match: '*'
      key_name: message
      parser: dmz-json
      reserve_data: on
      preserve_key: off

    - name: parser
      match: '*'
      key_name: message
      parser:
        - waf-deny
        - waf-warn
        - fw-drop
      reserve_data: on
      preserve_key: on

    - name: nest
      match: '*'
      operation: lift
      nested_under: alert
      add_prefix: alert_

    - name: modify
      match: '*'
      condition: 'Key_Value_Matches src_ip ^10\.10\.10\.(2|6)$'
      copy:
        - alert_xff client
        - xff client

    - name: modify
      match: '*'
      copy:
        - src_ip client

  outputs:
    - name: loki
      match: '*'
      host: 127.0.0.1
      port: 3100
      labels: job=dmz, host=$host, ident=$ident
      line_format: json

    - name: tcp
      match: '*'
      host: 127.0.0.1
      port: 5170
      format: json_lines
      json_date_key: date
      json_date_format: double
      workers: 1
      retry_limit: no_retries
