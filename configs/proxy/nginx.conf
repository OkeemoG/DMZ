# proxy: Reverse-Proxy der DMZ. Beendet TLS und gibt Anfragen an die WAF weiter.

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log /var/log/nginx/access.log;

    limit_req_zone $binary_remote_addr zone=req_limit:1m rate=20r/s;
    limit_req_status 429;

    # TLS nach BSI TR-02102-2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve brainpoolP512r1tls13:brainpoolP384r1tls13:brainpoolP256r1tls13:secp384r1:secp256r1:secp521r1:brainpoolP512r1:brainpoolP384r1:brainpoolP256r1;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;

    # Port 80: Umleitung auf HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/tls/proxy.crt;
        ssl_certificate_key /etc/nginx/tls/proxy.key;
        client_max_body_size 1m;

        location / {
            limit_req zone=req_limit burst=40 nodelay;

            proxy_pass http://10.10.10.6:8080;
            proxy_set_header Host $host;
            # Absenderadresse vom proxy selbst gesetzt, Angaben des Clients werden ersetzt (vermeidet manipulation)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
