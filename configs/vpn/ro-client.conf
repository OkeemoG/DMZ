# ro-client1, ro-client2: VPN-Client im Remote Office, Tunnel zu fw-edge (K-07, K-08), BSI TR-02102-3 (2026-01).
# Beide Clients nutzen diese Datei. Zertifikat und Schluessel bindet die Topologie je Knoten als client.crt und client.key ein.
# Nur Verkehr in das Firmennetz 10.10.0.0/16 geht durch den Tunnel, der uebrige Verkehr direkt ins Internet.

connections {
    firmennetz {
        version = 2
        remote_addrs = 203.0.113.2
        proposals = aes256gcm16-prfsha512-ecp512bp
        mobike = no
        rekey_time = 4h
        keyingtries = 0
        dpd_delay = 30s
        vips = 0.0.0.0
        local {
            auth = pubkey
            certs = client.crt
        }
        remote {
            auth = ecdsa-512-sha512
            id = "CN=fw-edge"
        }
        children {
            firmennetz {
                remote_ts = 10.10.0.0/16
                esp_proposals = aes256gcm16-ecp512bp
                rekey_time = 1h
                start_action = start
                dpd_action = restart
            }
        }
    }
}
