# strongSwan: Ergaenzung zu /etc/strongswan.conf, eingebunden ueber strongswan.d/*.conf.
# Im Container laeuft kein Syslog-Dienst, charon schreibt deshalb in eine Datei.

charon {
    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            flush_line = yes
            default = 1
        }
    }
}
