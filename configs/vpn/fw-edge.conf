# fw-edge: VPN-Endpunkt fuer das Remote Office (K-07, K-08), IKEv2 und IPsec nach BSI TR-02102-3 (2026-01).
# Je Client eine Verbindung: Zuordnung ueber die Identitaet im Zertifikat, feste virtuelle Adresse.
# Der Tunnel umfasst das Firmennetz 10.10.0.0/16. Welche Ziele erreichbar sind, regelt nftables (K-08, V-10).

connections {
    ro-client1 {
        version = 2
        local_addrs = 203.0.113.2
        proposals = aes256gcm16-prfsha512-ecp512bp
        mobike = no
        rekey_time = 4h
        pools = ro-client1
        local {
            auth = pubkey
            certs = fw-edge.crt
        }
        remote {
            auth = ecdsa-512-sha512
            id = "CN=ro-client1"
        }
        children {
            firmennetz {
                local_ts = 10.10.0.0/16
                esp_proposals = aes256gcm16-ecp512bp
                rekey_time = 1h
            }
        }
    }

    ro-client2 {
        version = 2
        local_addrs = 203.0.113.2
        proposals = aes256gcm16-prfsha512-ecp512bp
        mobike = no
        rekey_time = 4h
        pools = ro-client2
        local {
            auth = pubkey
            certs = fw-edge.crt
        }
        remote {
            auth = ecdsa-512-sha512
            id = "CN=ro-client2"
        }
        children {
            firmennetz {
                local_ts = 10.10.0.0/16
                esp_proposals = aes256gcm16-ecp512bp
                rekey_time = 1h
            }
        }
    }
}

pools {
    ro-client1 {
        addrs = 10.99.0.2/32
    }
    ro-client2 {
        addrs = 10.99.0.3/32
    }
}
